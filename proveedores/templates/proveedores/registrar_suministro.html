{% extends 'base.html' %}

{% block title %}Registrar Suministro — Matpi{% endblock %}

{% block content %}
<div class="formulario-seccion">
    <h1>Registrar Suministro de Materia Prima</h1>
    <p style="color: #666; margin-bottom: 20px;">Proveedor: <strong>{{ proveedor.nombre_proveedor }}</strong></p>

    <form action="{% url 'registrar_suministro_materia' %}" method="POST" class="custom-form" onsubmit="return confirm('¿Está seguro de que desea registrar este suministro?');">
        {% csrf_token %}
        <input type="hidden" name="txt_proveedor_id" value="{{ proveedor.id }}">

        <div class="form-group">
            <label for="txt_materia_id">Materia Prima</label>
            <select name="txt_materia_id" id="txt_materia_id" required>
                <option value="" disabled selected>Seleccione la materia prima</option>
                {% for materia in materias_primas %}
                <option value="{{ materia.id }}">{{ materia.nombre_materia_prima }} ( {{ materia.cantidad_por_unidad }} {{ materia.unidad_medida }}.)</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label for="txt_cantidad">Cantidad de unidades recibida</label>
                <input type="number" step="0.01" name="txt_cantidad" id="txt_cantidad" required>
            </div>

            <div class="form-group">
                <label for="txt_precio">Precio Unitario ($)</label>
                <input type="number" step="0.01" name="txt_precio" id="txt_precio" placeholder="Ej: 1500.00">
            </div>
        </div>

        <div class="form-group">
            <label for="txt_fecha">Fecha de Suministro</label>
            <input type="datetime-local" name="txt_fecha" id="txt_fecha" value="{{ fecha_actual|date:'Y-m-d\TH:i' }}" readonly style="pointer-events: none; background: #eef2f3; cursor: not-allowed;">
        </div>

        <div class="form-group">
            <label for="txt_vencimiento">Fecha de Vencimiento</label>
            <input type="date" name="txt_vencimiento" id="txt_vencimiento" required>
        </div>

        <div class="form-acciones">
            <button type="submit" class="btn btn-guardar">Registrar</button>
            <a href="{% url 'listar_proveedores' %}" class="btn btn-cancelar" onclick="return confirm('¿Está seguro de que desea cancelar el registro del suministro?');">Cancelar</a>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Lógica de auto-completado de precios
        const preciosRecientes = JSON.parse('{{ precios_json|safe }}');
        const selectMateria = document.getElementById('txt_materia_id');
        const inputPrecio = document.getElementById('txt_precio');

        if (selectMateria && inputPrecio) {
            selectMateria.addEventListener('change', function() {
                const materiaId = this.value;
                if (preciosRecientes[materiaId]) {
                    inputPrecio.value = preciosRecientes[materiaId];
                } else {
                    inputPrecio.value = "";
                }
            });
        }

        // La fecha de vencimiento no puede ser menor a una semana de la fecha actual
        const today = new Date();
        const oneWeekLater = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
        const yyyy = oneWeekLater.getFullYear();
        const mm = String(oneWeekLater.getMonth() + 1).padStart(2, '0');
        const dd = String(oneWeekLater.getDate()).padStart(2, '0');
        const formattedMinDate = `${yyyy}-${mm}-${dd}`;

        const inputFechaVencimiento = document.getElementById('txt_vencimiento');
        if (inputFechaVencimiento) {
            inputFechaVencimiento.min = formattedMinDate;
        }

        // Validar también en el submit del formulario por si acaso
        const form = document.querySelector('.custom-form');
        if (form && inputFechaVencimiento) {
            form.addEventListener('submit', function(event) {
                const vencimientoVal = inputFechaVencimiento.value;
                if (vencimientoVal) {
                    const selectedDate = new Date(vencimientoVal + 'T00:00:00');
                    const minDate = new Date(formattedMinDate + 'T00:00:00');
                    if (selectedDate < minDate) {
                        alert('La fecha de vencimiento no puede ser menor a una semana de la fecha actual (mínimo ' + formattedMinDate + ').');
                        event.preventDefault();
                        return false;
                    }
                }
            });
        }
    });
</script>
{% endblock %}

{% extends 'base.html' %}
{% load l10n %}
{% load static %}

{% block title %}Registrar Comida — Matpi{% endblock %}

{% block content %}
<div class="formulario-seccion">
    <h1>Registrar Comida</h1>

    <form method="POST" action="{% url 'registrar_producto' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label for="txt_nombre">Nombre del Producto</label>
            <input type="text" id="txt_nombre" name="txt_nombre" placeholder="Nombre de la comida" required minlength="3" maxlength="30">
        </div>

        <div class="form-group">
            <span class="form-label" style="font-weight: bold; display: block; margin-bottom: 8px;">Ingredientes (Composición)</span>
            <div class="table-container">
                <table class="table" id="tabla-composicion">
                    <thead>
                        <tr>
                            <th style="width: 35%;">Materia Prima</th>
                            <th style="width: 30%;">Cantidad Total Usada</th>
                            <th style="width: 15%; text-align: center;">Prioridad</th>
                            <th style="width: 15%;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="body-composicion">
                        <tr class="fila-materia">
                            <td>
                                <label class="sr-only label-select" for="select_materia_1">Seleccione Materia Prima</label>
                                <select name="materia_id[]" id="select_materia_1" class="form-control select-materia" required onchange="actualizarEquivalencia(this)">
                                    <option value="" data-equiv="" data-unidad="">Seleccione Materia Prima</option>
                                    {% for materia in materias_primas %}
                                        <option value="{{ materia.id }}" data-equiv="{{ materia.cantidad_por_unidad|unlocalize }}" data-unidad="{{ materia.unidad_medida }}">{{ materia.nombre_materia_prima }} ({{ materia.cantidad_por_unidad }} {{ materia.unidad_medida }})</option>
                                    {% endfor %}
                                </select>
                            </td>

                            <td>
                                <div class="input-group" style="display: flex; gap: 5px; align-items: center;">
                                    <button type="button" class="btn btn-outline-secondary btn-restar" onclick="restarUnidad(this)" title="Restar 1 unidad" style="padding: 2px 8px;">-</button>
                                    <label class="sr-only label-input" for="materia_cantidad_1">Cantidad Total Usada</label>
                                    <input type="number" id="materia_cantidad_1" name="materia_cantidad[]" class="form-control input-equiv" value="" min="0.01" step="0.01" required oninput="actualizarUnidades(this)" placeholder="0" style="text-align: center;">
                                    <button type="button" class="btn btn-outline-secondary btn-sumar" onclick="sumarUnidad(this)" title="Sumar 1 unidad" style="padding: 2px 8px;">+</button>
                                    <label class="sr-only label-unidad" for="materia_unidad_1">Unidad de medida</label>
                                    <input type="hidden" id="materia_unidad_1" name="materia_unidad[]" class="input-unidad-texto" value="">
                                    <span class="unit-label"></span>
                                </div>
                                <small class="msg-unidades text-success" style="display: block; margin-top: 5px; font-weight: bold;"></small>
                            </td>
                            <td style="text-align: center; vertical-align: middle;">
                                <input type="hidden" name="materia_prioridad[]" class="input-prioridad-valor" value="0">
                                <input type="checkbox" class="checkbox-prioridad" onchange="this.previousElementSibling.value = this.checked ? '1' : '0'">
                            </td>
                            <td>
                                <button type="button" class="btn btn-cancelar btn-sm" onclick="eliminarFila(this)">Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <button type="button" class="btn btn-azul btn-sm" onclick="agregarFila()" style="margin-top: 10px;">+ Agregar Ingrediente</button>
        </div>

        <div class="form-group">
            <label for="txt_precio">Precio de Venta</label>
            <input type="number" id="txt_precio" name="txt_precio" placeholder="Ingrese precio" required min="1000" max="90000">
        </div>

        <div class="form-group">
            <label for="txt_categoria">Categoría</label>
            <select id="txt_categoria" name="txt_categoria" required>
                <option value="">— Seleccione —</option>
                <option value="Hamburguesas">Hamburguesas</option>
                <option value="Perros Calientes">Perros Calientes</option>
                <option value="Entradas y Snacks">Entradas y Snacks</option>
                <option value="Combos">Combos</option>
                <option value="Postres">Postres</option>
                <option value="Adiciones">Adiciones</option>
                <option value="Salchipapas">Salchipapas</option>
            </select>
        </div>

        <div class="form-group">
            <label for="txt_imagen">Imagen del Producto</label>
            <input type="file" id="txt_imagen" name="txt_imagen" accept=".png, .jpg, .jpeg">
        </div>

        <button type="submit" class="btn btn-guardar">Guardar Comida</button>
        <a href="{% url 'listar_productos' %}" class="btn btn-cancelar" onclick="return confirm('¿Está seguro que quiere cancelar el registro?');">Cancelar</a>
    </form>
</div>

<script src="{% static 'js/productos.js' %}"></script>
{% endblock %}
